<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    font-family:Arial, sans-serif;
}

/* Bintang */

.stars span{
    position:absolute;
    color:white;
    animation:blink 2s infinite;
    font-size:20px;
}

.stars span:nth-child(1){
    top:10%;
    left:20%;
}

.stars span:nth-child(2){
    top:15%;
    right:20%;
}

.stars span:nth-child(3){
    top:30%;
    left:10%;
}

.stars span:nth-child(4){
    top:25%;
    right:10%;
}

.stars span:nth-child(5){
    top:70%;
    left:15%;
}

.stars span:nth-child(6){
    top:75%;
    right:15%;
}

@keyframes blink{
    0%,100%{
        opacity:0.3;
    }
    50%{
        opacity:1;
    }
}

/* Container */

.container{
    text-align:center;
}

/* Kue */

.cake{
    position:relative;
    width:280px;
    margin:auto;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* Lilin */

.candle{
    position:absolute;
    top:-85px;
    left:50%;
    transform:translateX(-50%);
    width:18px;
    height:75px;
    border-radius:10px;
    background:repeating-linear-gradient(
        45deg,
        white,
        white 5px,
        #ff8fab 5px,
        #ff8fab 10px
    );
}

.flame{
    position:absolute;
    top:-25px;
    left:50%;
    transform:translateX(-50%);
    width:25px;
    height:35px;
    border-radius:50%;
    background:radial-gradient(circle,yellow,orange,red);
    box-shadow:0 0 20px yellow;
    animation:fire 0.5s infinite alternate;
}

@keyframes fire{
    from{
        transform:translateX(-50%) scale(1);
    }
    to{
        transform:translateX(-50%) scale(1.15);
    }
}

/* Layer Kue */

.layer{
    position:relative;
    margin:auto;
    border-radius:20px;
}

.layer1{
    width:280px;
    height:80px;
    background:#ff4d6d;
}

.layer2{
    width:220px;
    height:70px;
    background:#ff85a1;
    margin-top:-15px;
}

.layer3{
    width:160px;
    height:60px;
    background:#ffc2d1;
    margin-top:-15px;
}

/* Cream */

.layer::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:18px;
    background:white;
    border-radius:20px;
}

/* Sprinkle */

.sprinkle{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;
}

.s1{
    top:20px;
    left:40px;
}

.s2{
    top:35px;
    right:50px;
}

.s3{
    top:25px;
    left:120px;
}

.s4{
    top:40px;
    right:100px;
}

.s5{
    top:15px;
    left:180px;
}

/* Piring */

.plate{
    width:340px;
    height:25px;
    background:#f1f1f1;
    border-radius:50%;
    margin:auto;
    margin-top:-8px;
    box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

/* Tulisan */

.text{
    margin-top:35px;
    font-size:48px;
    color:white;
    font-family:'Pacifico', cursive;
    text-shadow:
        0 0 10px rgba(255,255,255,0.7),
        0 0 20px rgba(255,105,180,0.7),
        0 0 30px rgba(255,20,147,0.7);
}

/* Tombol */

.lanjut{
    display:inline-block;
    margin-top:25px;
    padding:12px 35px;
    background:white;
    color:#ff4d6d;
    text-decoration:none;
    border-radius:30px;
    font-size:20px;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.lanjut:hover{
    transform:scale(1.08);
    background:#ff4d6d;
    color:white;
}

</style>
</head>
<body>

<div class="stars">
    <span>✨</span>
    <span>⭐</span>
    <span>✨</span>
    <span>⭐</span>
    <span>✨</span>
    <span>⭐</span>
</div>

<div class="container">

    <div class="cake">

        <div class="candle">
            <div class="flame"></div>
        </div>

        <div class="layer layer3">
            <div class="sprinkle s1"></div>
            <div class="sprinkle s2"></div>
        </div>

        <div class="layer layer2">
            <div class="sprinkle s3"></div>
            <div class="sprinkle s4"></div>
        </div>

        <div class="layer layer1">
            <div class="sprinkle s5"></div>
        </div>

    </div>

    <div class="plate"></div>

    <div class="text">
        Happy Birthday
    </div>

    <a href="iqna.html" class="lanjut">
        Lanjut →
    </a>

</div>

</body>
</html>
